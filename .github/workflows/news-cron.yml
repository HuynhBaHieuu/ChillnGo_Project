# Fetches the Newsfeed's news sources every hour (Vercel's free plan runs its
# own cron only once a day). Needs the repository secret NEWS_CRON_SECRET, the
# same value as CRON_SECRET on the API; the API address can be overridden with
# the repository variable NEWS_API_URL.
name: News cron

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch due news sources
        env:
          API_URL: ${{ vars.NEWS_API_URL || 'https://chillgo-project.vercel.app' }}
          CRON_SECRET: ${{ secrets.NEWS_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "NEWS_CRON_SECRET is not set; skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 280 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$API_URL/api/news/cron"
