# 4 GB is plenty for this app. The template's 8 GB (plus 4 GB of metaspace)
# ran a 16 GB computer out of memory while `npm run dev` also ran the
# emulator, the API and the web app.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# On Windows, plugins compile from the pub cache (usually on C:). When the
# project is on another drive (D:), Kotlin's incremental compiler fails with
# "this and base files have different roots". Full compiles avoid it.
kotlin.incremental=false
# Compile Kotlin inside the Gradle process rather than in a second Java
# process that holds on to another 1.5 GB or so.
kotlin.compiler.execution.strategy=in-process
