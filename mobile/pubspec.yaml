name: chillngo
description: "ChillnGo: review & clone your journey (mobile app)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State, navigation, network
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  dio: ^5.11.1
  collection: ^1.19.1
  intl: ^0.20.3

  # Storage
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6

  # Media
  cached_network_image: ^4.0.4
  image_picker: ^1.2.3
  video_player: ^2.14.1
  wakelock_plus: ^1.8.1

  # Maps and places
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.0.1

  # Livestream (LiveKit, the same service the web app uses)
  livekit_client: ^2.13.0
  permission_handler: ^13.0.2

  # Platform
  google_sign_in: ^7.2.0
  url_launcher: ^6.3.3
  share_plus: ^13.3.1
  device_info_plus: ^13.3.0

  # Icons: Lucide, the set the web app uses
  lucide_icons_flutter: ^3.1.21
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # Demo journeys, comments, follows… shared with the web app (web/src/mocks).
    - assets/mocks/

  # The web's "void" theme (web/src/styles/theme-void.css), turned on by
  # data-theme="void" in web/index.html.
  fonts:
    # Headings
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans_500Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans_700Bold.ttf
          weight: 700
    # Running text
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_400Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter_700Bold.ttf
          weight: 700
    # Labels, figures and status chips
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono_400Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono_700Bold.ttf
          weight: 700
